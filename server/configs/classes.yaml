event_ontology:
  - name: "enter"
    description: "An entity enters the camera field of view or monitored zone"
  - name: "exit"
    description: "An entity departs from the camera field of view or monitored zone"
  - name: "loiter"
    description: "An entity remains within a localized spatial area for an extended duration exceeding dwell threshold"
  - name: "carry"
    description: "A person moves with an object maintaining spatial proximity and co-motion"
  - name: "place"
    description: "A person brings an object into a location and separates from it"
  - name: "leave"
    description: "An object is left unattended by the person who brought or carried it"
  - name: "stationary"
    description: "An entity remains stationary without moving beyond displacement threshold"
  - name: "interaction"
    description: "Two or more entities interact within close spatial proximity"
