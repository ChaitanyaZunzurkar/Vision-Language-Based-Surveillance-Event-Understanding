# Surveillance Video Event Understanding Configuration

server:
  host: "0.0.0.0"
  port: 8000
  reset_data_on_startup: false
  reset_data_on_dashboard_open: false
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"
    - "http://127.0.0.1:3000"
    - "http://127.0.0.1:5173"

paths:
  uploads_dir: "data/uploads"
  outputs_dir: "data/outputs"
  clips_dir: "data/outputs/clips"
  tracks_dir: "data/outputs/tracks"
  windows_dir: "data/outputs/windows"
  weights_dir: "weights"
  database_url: "sqlite:///./events.db"
  vector_store_path: "data/vectors/event_vectors.pkl"

video:
  sample_fps: 4.0
  max_dimension: 1280

detection:
  model_weights: "weights/yolo11s_surv_v2.pt"
  conf_threshold: 0.20
  iou_threshold: 0.45
  device: "auto"

# Project-owned Stage 1b resources. Paths are relative to the repository root.
stage1b:
  tracker_script: "src/tracking/surveillance_tracker.py"
  weights_path: "models/stage1b/yolo11x_surv_v1.pt"
  class_config: "configs/stage1_model.yaml"
  bytetrack_yaml: "configs/bytetrack_custom.yaml"
  frame_stride: 1

tracking:
  track_high_thresh: 0.50
  track_low_thresh: 0.20
  new_track_thresh: 0.60
  track_buffer: 30
  match_thresh: 0.80

temporal:
  window_duration_sec: 10.0
  window_stride_sec: 5.0
  loiter_dwell_sec: 4.0
  loiter_displacement_ratio: 0.35
  proximity_threshold_person_heights: 1.0

vlm:
  model_name: "Qwen/Qwen2.5-VL-7B-Instruct"
  device: "auto"
  max_tokens: 1024
  temperature: 0.2

anomaly:
  model_weights: "weights/best_model.pkl"
  scaler_weights: "weights/scaler.pkl"
  videomae_model: "MCG-NJU/videomae-base-finetuned-kinetics"
  clip_duration_sec: 4.0
  clip_stride_sec: 2.0
  num_frames: 16
  anomaly_threshold: 0.50

evidence:
  padding_before_sec: 1.5
  padding_after_sec: 1.5
  output_format: "mp4"

retrieval:
  top_k: 5
  min_similarity: 0.20
